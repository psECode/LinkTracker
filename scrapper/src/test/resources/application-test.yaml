app:
  access-type: jpa
  kafka:
    topic-name: "link_updates"

spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: update
  liquibase:
    enabled: false

logging:
  level:
    root: WARN
    backend.academy: INFO
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger: OFF
    org.testcontainers: INFO
