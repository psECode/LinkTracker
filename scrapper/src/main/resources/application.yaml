server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper
    username: postgres
    password: postgres
  application:
    name: scrapper

  liquibase:
    enabled: true
    change-log: classpath:migrations/changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:29092

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-0123456789abcdef-0123456789}
    ttl: 24h
  internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  stackoverflow:
    key: ${STACKOVERFLOW_KEY:}
    access-token: ${STACKOVERFLOW_ACCESS_KEY:} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    token: ${GITHUB_TOKEN:}
  bot:
    url: http://localhost:8080
    timeout: 2s
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  scheduler:
    interval: 30s
    linkcheckinterval: 1m
    batch-size: 10
  access-type: jdbc
  use-queue: true
  kafka:
    bootstrap-servers: localhost:29092
    schema-registry-url: "http://localhost:8083"
    use-queue: true
    topic-name: "link.raw-updates"

resilience4j:
  retry:
    instances:
      botUpdateRetry:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException.BadRequest

  circuitbreaker:
    instances:
      botUpdateCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3

management:
  server:
    port: 8012
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        request_duration_ms_total: true
