server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper
    username: postgres
    password: postgres

  liquibase:
    enabled: true
    change-log: file:migrations/changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    topic-name: "link_updates"

app:
  stackoverflow:
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY:} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
  bot:
    url: http://localhost:8080
    timeout: 2s
  scheduler:
    interval: 30s
    linkcheckinterval: 1m
    batch-size: 10
  access-type: jdbc
  use-queue: true
  kafka:
    bootstrap-servers: localhost:9092
    topic-name: "link_updates"
    schema-registry-url: "http://localhost:8081"
    use-queue: true

resilience4j:
  retry:
    instances:
      botUpdateRetry:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException.BadRequest

  circuitbreaker:
    instances:
      botUpdateCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
