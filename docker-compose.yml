services:
  db:
    image: postgres:17-alpine
    container_name: scrapper_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapper}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scrapper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker_cache
    ports:
      - "6379:6379"
    command: valkey-server --protected-mode no

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6G9ogYRE6_ZpWpB9F9mg'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    container_name: scrapper
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-scrapper}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_KAFKA_SCHEMAREGISTRYURL: http://schema-registry:8081
      APP_BOT_URL: http://bot:8080
      APP_BOT_INTERNALTOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      APP_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-0123456789abcdef-0123456789}
      APP_INTERNALTOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      APP_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY:-}
      APP_STACKOVERFLOW_ACCESSTOKEN: ${STACKOVERFLOW_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_KAFKA_SCHEMAREGISTRYURL: http://schema-registry:8081
      SPRING_DATA_REDIS_HOST: redis
      APP_INTERNALTOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      APP_SCRAPPER_URL: http://scrapper:8081
    depends_on:
      - scrapper
      - kafka
      - redis

  ai-agent:
    build:
      context: .
      dockerfile: ai-agent/Dockerfile
    container_name: ai-agent
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_KAFKA_SCHEMAREGISTRYURL: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - scrapper
