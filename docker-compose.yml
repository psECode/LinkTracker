version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: scrapper_db
    environment:
      POSTGRES_DB: scrapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scrapper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linktracker_redis
    ports:
      - "6379:6379"

  migrations:
    image: liquibase/liquibase:4.25
    volumes:
      - ./scrapper/migrations:/liquibase/changelog
    command: >
      --changelog-file=changelog-master.xml
      --url=jdbc:postgresql://db:5432/scrapper
      --username=postgres
      --password=postgres
      update
    depends_on:
      db:
        condition: service_healthy

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    env_file:
      - ./scrapper/src/main/resources/dev.env
    container_name: scrapper_app
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/scrapper
      - APP_BOT_URL=http://bot:8080
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      migrations:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./bot/src/main/resources/dev.env
    container_name: bot_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=redis
      - APP_SCRAPPER_URL=http://scrapper:8081
    depends_on:
      scrapper:
        condition: service_started
      redis:
        condition: service_started
