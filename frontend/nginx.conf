server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://scrapper:8081;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://scrapper:8081;
        proxy_set_header Host $host;
    }
}
