server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://scrapper:8081;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://scrapper:8081;
        proxy_set_header Host $host;
    }
}
