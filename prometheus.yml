global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'scrapper'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8012', 'scrapper:8012']

  - job_name: 'bot'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8011', 'bot:8011']