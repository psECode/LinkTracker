---
# отдельная джоба чтобы запускалось отдельно от приложений и БД
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrations
  namespace: link-tracker
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: db-migrations
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-postgres
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
        command: ["sh", "-c"]
        args:
          - |
            until pg_isready -h postgres-0.postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" 2>/dev/null; do
              echo "waiting for postgres to become ready..."
              sleep 2
            done
            echo "postgres is ready"
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 64Mi
      containers:
      - name: liquibase
        image: link-tracker-migrations:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: LIQUIBASE_COMMAND_URL
          value: jdbc:postgresql://postgres-0.postgres:5432/scrapper
        - name: LIQUIBASE_COMMAND_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: LIQUIBASE_COMMAND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
