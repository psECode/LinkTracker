---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-logs
  namespace: link-tracker
  labels:
    app: vector-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-logs
  labels:
    app: vector-logs
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-logs
  labels:
    app: vector-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-logs
subjects:
- kind: ServiceAccount
  name: vector-logs
  namespace: link-tracker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-logs-config
  namespace: link-tracker
  labels:
    app: vector-logs
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: false

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        glob_minimum_cooldown_ms: 1000

    transforms:
      link_tracker_apps:
        type: filter
        inputs:
          - kubernetes_logs
        condition: |
          .kubernetes.pod_namespace == "link-tracker" &&
            !starts_with(to_string(.kubernetes.pod_name) ?? "", "vector-logs")

      parse_json:
        type: remap
        inputs:
          - link_tracker_apps
        source: |
          # JSON-логи приложения раскрываем в отдельные поля;
          # не-JSON строки (nginx access log, баннеры JVM и т.п.) остаются как есть в .message
          parsed, err = parse_json(.message)
          if err == null {
            # infallible-форма merge: vector 0.60 требует, чтобы ошибка merge была
            # присвоена переменной, иначе VRL не компилируется (внутри if err==null
            # merge фактически не падает, но статический тип . неизвестен)
            ., merge_err = merge(., parsed)
          }
          # метаданные пода из имени файла с логами (flatten, без вложенного объекта)
          .namespace = .kubernetes.pod_namespace
          .pod_name = .kubernetes.pod_name
          .container_name = .kubernetes.container_name
          del(.kubernetes)

    sinks:
      victoria_logs:
        type: http
        inputs:
          - parse_json
        uri: "http://victoria-logs.link-tracker.svc.cluster.local:9428/insert/jsonline?_stream_fields=namespace,pod_name,service.name&_msg_field=message&_time_field=@timestamp"
        method: post
        compression: gzip
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false
        batch:
          max_events: 1000
          timeout_secs: 1
        request:
          retry_max_attempts: 10
          retry_initial_backoff_secs: 1
          retry_max_duration_secs: 30
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-logs
  namespace: link-tracker
  labels:
    app: vector-logs
spec:
  selector:
    matchLabels:
      app: vector-logs
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: vector-logs
    spec:
      serviceAccountName: vector-logs
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vector
        image: timberio/vector:0.60.0-debian
        imagePullPolicy: IfNotPresent
        args: ["--config", "/etc/vector/vector.yaml"]
        env:
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        - name: vector-data
          mountPath: /vector-data-dir
        - name: var-log-pods
          mountPath: /var/log/pods
          readOnly: true
        - name: var-lib-docker-containers
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vector-logs-config
      - name: vector-data
        emptyDir: {}
      - name: var-log-pods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: var-lib-docker-containers
        hostPath:
          path: /var/lib/docker/containers
          type: DirectoryOrCreate
