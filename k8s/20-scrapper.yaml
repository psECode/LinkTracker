---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapper
  namespace: link-tracker
  labels:
    app: scrapper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapper
  template:
    metadata:
      labels:
        app: scrapper
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8012"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: scrapper
        image: link-tracker-scrapper:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        - name: metrics
          containerPort: 8012
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: link-tracker-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        readinessProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scrapper
  namespace: link-tracker
spec:
  selector:
    app: scrapper
  ports:
  - port: 8081
    targetPort: 8081
