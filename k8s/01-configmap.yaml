---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: link-tracker
data:
  # kafka
  SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
  APP_KAFKA_BOOTSTRAPSERVERS: kafka:9092
  APP_KAFKA_SCHEMAREGISTRYURL: http://schema-registry:8081
  # bot&scrapper
  APP_BOT_URL: http://bot:8080
  APP_SCRAPPER_URL: http://scrapper:8081
  # redis(ka)
  SPRING_DATA_REDIS_HOST: redis
  # migrations сделает отдельная джоба
  SPRING_LIQUIBASE_ENABLED: "false"
  # postgres
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scrapper
