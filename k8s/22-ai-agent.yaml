---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: link-tracker
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: ai-agent
        image: link-tracker-ai-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: metrics
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: link-tracker-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "prometheus,health"
        - name: MANAGEMENT_METRICS_TAGS_APPLICATION
          value: "ai-agent"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
