---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: link-tracker
  labels:
    app: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
  - name: internal
    port: 9092
    targetPort: internal
  - name: controller
    port: 9093
    targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: link-tracker
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
          name: internal
        - containerPort: 9093
          name: controller
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        # был localhost, потому что в Deployment `1@kafka` резолвился в ClusterIP
        # и KRaft не собирался; со StatefulSet у пода стабильное DNS-имя —
        # voter адресуется через headless DNS
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0.kafka.link-tracker.svc:9093
        - name: KAFKA_LISTENERS
          value: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://kafka-0.kafka.link-tracker.svc:9092
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: CLUSTER_ID
          value: 4L6G9ogYRE6_ZpWpB9F9mg
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        readinessProbe:
          tcpSocket:
            port: internal
          initialDelaySeconds: 25
          periodSeconds: 10
          failureThreshold: 18
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1536Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
