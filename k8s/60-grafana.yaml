# Grafana + дашборды Link Tracker. Разворачивается в link-tracker.
# UI: http://<minikube-ip>:30500 (admin/admin)
# Дашборды: Обзор (SLI/SLO), Scrapper, Frontend — по k8s/SLI-SLO-SLA.md.
# Перегенерация: python3 scripts/render-dashboards.py
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: link-tracker
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: vmsingle
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.default.svc.cluster.local:8428
        isDefault: true
        jsonData:
          timeInterval: 15s
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs.link-tracker.svc.cluster.local:9428
        jsonData:
          maxLinesPerQuery: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: link-tracker
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: Link Tracker
        type: file
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bot
  namespace: link-tracker
  labels:
    app: grafana
data:
  bot.json: |
    {
      "title": "Link Tracker · Bot",
      "uid": "link-tracker-bot",
      "tags": [
        "bot",
        "telegram"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 39,
      "version": 2,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Bot status",
          "description": "up таргета скрейпа метрик бота (:8011/metrics)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time(up{pod=~\"bot-.*\"}[5m])"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "max": 1,
              "noValue": "unknown",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "empty",
                    "result": {
                      "text": "unknown",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "up",
                      "color": "green"
                    },
                    "0": {
                      "text": "down",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.98
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Commands rps",
          "description": "command_requests_total по типам команд (значение появится после использования бота)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(command_requests_total{application=\"bot\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Command latency p95",
          "description": "p95 command_duration_ms_total по типам команд",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(command_duration_ms_total_seconds_bucket{application=\"bot\"}[5m])) by (le))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Notifications sent (30d)",
          "description": "sent_notification_total — дельта за 30 дней",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(sent_notification_total{application=\"bot\"}[30d]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Commands by type",
          "description": "rate command_requests_total по команде",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(command_requests_total{application=\"bot\"}[5m])) by (command)",
              "legendFormat": "{{command}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "p95 latency by command",
          "description": "histogram_quantile по command_duration_ms_total_seconds_bucket",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(command_duration_ms_total_seconds_bucket{application=\"bot\"}[5m])) by (le, scope_type))",
              "legendFormat": "{{scope_type}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "heatmap",
          "title": "Command latency heatmap",
          "description": "Распределение латентности команд по времени и бакетам (increase за 5m)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(command_duration_ms_total_seconds_bucket{application=\"bot\",le!=\"+Inf\"}[5m])) by (le)",
              "format": "heatmap"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "scaleDistribution": {
                  "type": "log"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "calculate": false,
            "cellGap": 1,
            "color": {
              "exponent": 0.5,
              "fill": "dark",
              "mode": "scheme",
              "reverse": false,
              "scheme": "Oranges",
              "steps": 64
            },
            "exemplars": {
              "color": "rgba(255,255,255,0.4)"
            },
            "filterValues": {
              "le": 1e-09
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "showValue": "never",
            "yAxis": {
              "axisLabel": "latency",
              "axisPlacement": "left",
              "reverse": false,
              "unit": "s"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "JVM heap vs max",
          "description": "heap/max по процессам бота",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{application=\"bot\", area=\"heap\"} / jvm_memory_max_bytes{application=\"bot\", area=\"heap\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "custom": {
                "thresholdsStyle": {
                  "mode": "dashed+lines"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Bot logs",
          "description": "Victoria Logs: структурные логи бота (args.<имя> — параметры)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service.name=\"bot\"}"
            }
          ]
        }
      ]
    }
---
