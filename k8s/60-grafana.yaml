                    "result": {
                      "text": "ок",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 60,
                    "to": 100,
                    "result": {
                      "text": "тревожно",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 100,
                    "to": 9999,
                    "result": {
                      "text": "исчерпан",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Бюджет latency",
          "description": "Бюджет SLO latency = 5% запросов медленнее 1s за 30 дней. >100% — бюджет исчерпан",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(increase(http_server_requests_seconds_count{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\",le=\"+Inf\"}[30d])) - sum(increase(http_server_requests_seconds_count{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\",le=\"1\"}[30d]))) / (0.05 * (sum(increase(http_server_requests_seconds_count{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\",le=\"+Inf\"}[30d])) or vector(1)))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 60,
                    "result": {
                      "text": "ок",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 60,
                    "to": 100,
                    "result": {
                      "text": "тревожно",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 100,
                    "to": 9999,
                    "result": {
                      "text": "исчерпан",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 9,
