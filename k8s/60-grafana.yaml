            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 25,
          "type": "stat",
          "title": "AI service",
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{pod=~\"ai-agent.*\"}[2m])"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "max": 1,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "up",
                      "color": "green"
                    },
                    "0": {
                      "text": "down",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Доступность API",
          "description": "Доля ответов без серверных ошибок (5xx) за 30 дней. Цель ≥95%. Бюджет ошибок: 5% отказов",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - ((sum(increase(http_server_requests_seconds_count{application=\"scrapper\",status=~\"5..\"}[30d])) or vector(0)) / (sum(increase(http_server_requests_seconds_count{application=\"scrapper\"}[30d])) or vector(1))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 93,
                    "result": {
                      "text": "не выполняется",
                      "color": "red"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 93,
                    "to": 95,
                    "result": {
                      "text": "на грани",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 95,
                    "to": 100,
                    "result": {
                      "text": "выполняется",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Обработка ссылок",
          "description": "Доля успешных проверок ссылок во внешних источниках и пользовательских add/remove за 5m. Цель ≥95%. Падение ниже 95% — внешние API недоступны",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * ((sum(rate(link_checks_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) + (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0))) / ((sum(rate(link_checks_total{application=\"scrapper\"}[5m])) or vector(0)) + (sum(rate(links_tracked_total{application=\"scrapper\"}[5m])) or vector(0)))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 93,
                    "result": {
                      "text": "не выполняется",
                      "color": "red"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 93,
                    "to": 95,
                    "result": {
                      "text": "на грани",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 95,
                    "to": 100,
                    "result": {
                      "text": "выполняется",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Latency p95 API",
          "description": "95-й процентиль времени ответа основных ручек API (scrapper) за 5m. Цель <1s",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\"}[5m])) by (le))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
