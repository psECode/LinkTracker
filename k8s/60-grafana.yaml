apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-scrapper
  namespace: link-tracker
  labels:
    app: grafana
data:
  scrapper.json: |
    {
      "title": "Link Tracker · Scrapper",
      "uid": "link-tracker-scrapper",
      "tags": [
        "scrapper",
        "api"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "schemaVersion": 39,
      "version": 2,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Успешность обработки ссылок",
          "description": "Доля успешных проверок ссылок во внешних источниках за 5m. Падение ниже 95% — внешние API недоступны",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(link_checks_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) / (sum(rate(link_checks_total{application=\"scrapper\"}[5m])) or vector(1))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Успешность add/remove ссылок",
          "description": "Доля успешных пользовательских операций со ссылками за 5m",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) / (sum(rate(links_tracked_total{application=\"scrapper\"}[5m])) or vector(1))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latency p95 API",
          "description": "p95 времени ответа основных ручек за 5m",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\"}[5m])) by (le))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Доступность API",
