          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Авторизация: успех/неуспех",
          "description": "auth_events_total по операции и результату",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(auth_events_total{application=\"scrapper\"}[5m])) by (operation, outcome)",
              "legendFormat": "{{operation}} {{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Ссылок на трекинге",
          "description": "links_on_track по типам источников",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(links_on_track{application=\"scrapper\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "JVM heap к максимуму",
          "description": "Память процесса scrapper",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(jvm_memory_used_bytes{application=\"scrapper\", area=\"heap\"} / jvm_memory_max_bytes{application=\"scrapper\", area=\"heap\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 13,
          "type": "logs",
          "title": "Логи scrapper",
          "description": "Victoria Logs: WARN/ERROR — сообщение чистым текстом, параметры в args.<имя>",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 29
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service.name=\"scrapper\"} AND level:~\"ERROR|WARN\""
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: link-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_INSTALL_PLUGINS
              value: victoriametrics-logs-datasource
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-bot
              - configMap:
                  name: grafana-dashboard-overview
              - configMap:
                  name: grafana-dashboard-scrapper
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: link-tracker
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30500
