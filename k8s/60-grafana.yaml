                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Бюджет ссылок",
          "description": "Бюджет SLO обработки ссылок = 5% неуспешных операций за 30 дней. >100% — бюджет исчерпан",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * ((sum(increase(link_checks_total{application=\"scrapper\",outcome!=\"success\"}[30d])) or vector(0)) + (sum(increase(links_tracked_total{application=\"scrapper\",outcome!=\"success\"}[30d])) or vector(0))) / (0.05 * ((sum(increase(link_checks_total{application=\"scrapper\"}[30d])) or vector(0)) + (sum(increase(links_tracked_total{application=\"scrapper\"}[30d])) or vector(1))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
