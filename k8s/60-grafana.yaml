apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-scrapper
  namespace: link-tracker
  labels:
    app: grafana
data:
  scrapper.json: |
    {
      "title": "Link Tracker · Scrapper",
      "uid": "link-tracker-scrapper",
      "tags": [
        "scrapper",
        "api"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "schemaVersion": 39,
      "version": 3,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Link processing success",
          "description": "Доля успешных проверок ссылок во внешних источниках за 5m. Падение ниже 95% — внешние API недоступны",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(link_checks_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) / (sum(rate(link_checks_total{application=\"scrapper\"}[5m])) or vector(1))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Add/remove success",
          "description": "Доля успешных пользовательских операций со ссылками за 5m.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) / ((sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) + (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"failure\",error_type=\"server\"}[5m])) or vector(0)))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "API latency p95",
          "description": "p95 времени ответа основных ручек за 5m",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\"}[5m])) by (le))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "API availability",
          "description": "Доля ответов без 5xx за 5m",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - ((sum(rate(http_server_requests_seconds_count{application=\"scrapper\",status=~\"5..\"}[5m])) or vector(0)) / (sum(rate(http_server_requests_seconds_count{application=\"scrapper\"}[5m])) or vector(1))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Link checks: success / failure",
          "description": "Темп проверок ссылок во внешних источниках по результату и источнику",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(link_checks_total{application=\"scrapper\"}[5m])) by (source, outcome)",
              "legendFormat": "{{source}} · {{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "External source checks p95",
          "description": "p95 request_duration_ms по источнику (github/stackoverflow)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(request_duration_ms_total_seconds_bucket{application=\"scrapper\"}[5m])) by (le, scope_type))",
              "legendFormat": "{{scope_type}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "p95 latency by endpoint",
          "description": "p95 http_server_requests по каждой ручке",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"scrapper\"}[5m])) by (le, uri))",
              "legendFormat": "{{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "RPS by endpoint",
          "description": "Частота запросов по uri",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"scrapper\"}[1m])) by (uri)",
              "legendFormat": "{{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "heatmap",
          "title": "API latency heatmap",
          "description": "Распределение латентности API по времени и бакетам гистограммы (increase за 5m)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(http_server_requests_seconds_bucket{application=\"scrapper\",le!=\"+Inf\"}[5m])) by (le)",
              "format": "heatmap"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "scaleDistribution": {
                  "type": "log"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "calculate": false,
            "cellGap": 1,
            "color": {
              "exponent": 0.5,
              "fill": "dark",
              "mode": "scheme",
              "reverse": false,
              "scheme": "Oranges",
              "steps": 64
            },
            "exemplars": {
              "color": "rgba(255,255,255,0.4)"
            },
            "filterValues": {
              "le": 1e-09
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "showValue": "never",
            "yAxis": {
              "axisLabel": "latency",
              "axisPlacement": "left",
              "reverse": false,
              "unit": "s"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Response statuses",
          "description": "Распределение ответов по классам (2xx/4xx/5xx)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"scrapper\"}[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Auth: success / failure",
          "description": "auth_events_total по операции и результату",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(auth_events_total{application=\"scrapper\"}[5m])) by (operation, outcome)",
              "legendFormat": "{{operation}} · {{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Tracked links",
          "description": "links_on_track по типам источников",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(links_on_track{application=\"scrapper\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "JVM heap vs max",
          "description": "Память процесса scrapper",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 29
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(jvm_memory_used_bytes{application=\"scrapper\", area=\"heap\"} / jvm_memory_max_bytes{application=\"scrapper\", area=\"heap\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 13,
          "type": "logs",
          "title": "Scrapper logs",
          "description": "Victoria Logs: WARN/ERROR — сообщение чистым текстом, параметры в args.<имя>",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service.name=\"scrapper\"} AND level:~\"ERROR|WARN\""
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: link-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_INSTALL_PLUGINS
              value: victoriametrics-logs-datasource
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-bot
              - configMap:
                  name: grafana-dashboard-overview
              - configMap:
                  name: grafana-dashboard-postgres
              - configMap:
                  name: grafana-dashboard-scrapper
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: link-tracker
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30500
