            {
              "refId": "A",
              "expr": "100 * ((sum(rate(link_checks_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) + (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0))) / ((sum(rate(link_checks_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) + (sum(rate(link_checks_total{application=\"scrapper\",outcome=\"failure\"}[5m])) or vector(0)) + (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[5m])) or vector(0)) + (sum(rate(links_tracked_total{application=\"scrapper\",outcome=\"failure\",error_type=\"server\"}[5m])) or vector(0)))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 93,
                    "result": {
                      "text": "not met",
                      "color": "red"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 93,
                    "to": 95,
                    "result": {
                      "text": "at risk",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 95,
                    "to": 100,
                    "result": {
                      "text": "ok",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "API latency p95",
          "description": "95-й процентиль времени ответа основных ручек API (scrapper) за 5m. Цель <1s",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 3
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\"}[5m])) by (le))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 0.7,
                    "result": {
                      "text": "ok",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 0.7,
                    "to": 1,
                    "result": {
                      "text": "at risk",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 999,
                    "result": {
                      "text": "not met",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Liveness",
          "description": "Минимальная доля времени, когда сервисы отвечали скрейпу, за 5m. Цель ≥98%. 99% означает периодический сбой скрейпа",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 3
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * min(avg_over_time(up{pod=~\"(scrapper|bot|frontend|ai-agent)-.*\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 97,
                    "result": {
                      "text": "not met",
                      "color": "red"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 97,
                    "to": 98,
                    "result": {
                      "text": "at risk",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 98,
                    "to": 100,
                    "result": {
                      "text": "ok",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 97
                  },
                  {
                    "color": "green",
                    "value": 98
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Availability budget",
          "description": "Бюджет SLO доступности = 5% отказов за 30 дней. >100% — SLO нарушено, сервисный кредит",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * ((sum(increase(http_server_requests_seconds_count{application=\"scrapper\",status=~\"5..\"}[30d])) or vector(0)) / (0.05 * (sum(increase(http_server_requests_seconds_count{application=\"scrapper\"}[30d])) or vector(1))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 60,
                    "result": {
                      "text": "ok",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 60,
                    "to": 100,
                    "result": {
                      "text": "warning",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 100,
                    "to": 9999,
                    "result": {
                      "text": "exhausted",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Link budget",
          "description": "Бюджет SLO обработки ссылок = 5% серверных ошибок (5xx) за 30 дней. Ошибки пользователя (4xx) не расходуют бюджет. >100% — бюджет исчерпан",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * ((sum(increase(link_checks_total{application=\"scrapper\",outcome=\"failure\"}[30d])) or vector(0)) + (sum(increase(links_tracked_total{application=\"scrapper\",outcome=\"failure\",error_type=\"server\"}[30d])) or vector(0))) / (0.05 * ((sum(increase(link_checks_total{application=\"scrapper\",outcome=\"success\"}[30d])) or vector(0)) + (sum(increase(link_checks_total{application=\"scrapper\",outcome=\"failure\"}[30d])) or vector(0)) + (sum(increase(links_tracked_total{application=\"scrapper\",outcome=\"success\"}[30d])) or vector(0)) + (sum(increase(links_tracked_total{application=\"scrapper\",outcome=\"failure\",error_type=\"server\"}[30d])) or vector(1))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 60,
                    "result": {
                      "text": "ok",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 60,
                    "to": 100,
                    "result": {
                      "text": "warning",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 100,
                    "to": 9999,
                    "result": {
                      "text": "exhausted",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Latency budget",
          "description": "Бюджет SLO latency = 5% запросов медленнее 1s за 30 дней. >100% — бюджет исчерпан",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(increase(http_server_requests_seconds_count{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\",le=\"+Inf\"}[30d])) - sum(increase(http_server_requests_seconds_count{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\",le=\"1\"}[30d]))) / (0.05 * (sum(increase(http_server_requests_seconds_count{application=\"scrapper\",uri=~\"/api/links|/api/push/.*|/auth/.*\",le=\"+Inf\"}[30d])) or vector(1)))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "max": 100,
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 60,
                    "result": {
                      "text": "ok",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 60,
                    "to": 100,
                    "result": {
                      "text": "warning",
                      "color": "orange"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 100,
                    "to": 9999,
                    "result": {
                      "text": "exhausted",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Link processing by source",
          "description": "Успешность проверок во внешних источниках (github/stackoverflow), 5m",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(link_checks_total{application=\"scrapper\",outcome=\"success\"}[5m])) by (source) / sum(rate(link_checks_total{application=\"scrapper\"}[5m])) by (source))",
              "legendFormat": "{{source}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "custom": {
                "thresholdsStyle": {
                  "mode": "dashed+lines"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Load",
          "description": "RPS API scrapper + темп проверок ссылок планировщиком",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"scrapper\"}[1m]))",
              "legendFormat": "api rps"
            },
            {
              "refId": "B",
              "expr": "sum(rate(link_checks_total{application=\"scrapper\"}[5m]))",
              "legendFormat": "link checks/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
