          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - ((sum(rate(http_server_requests_seconds_count{application=\"scrapper\",status=~\"5..\"}[5m])) or vector(0)) / (sum(rate(http_server_requests_seconds_count{application=\"scrapper\"}[5m])) or vector(1))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 93
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Проверки ссылок: успех/неуспех",
          "description": "Темп проверок ссылок во внешних источниках по результату и источнику",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(link_checks_total{application=\"scrapper\"}[5m])) by (source, outcome)",
