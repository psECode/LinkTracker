---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: link-tracker
  labels:
    app: bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
      - name: bot
        image: link-tracker-bot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: link-tracker-secrets
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: link-tracker
spec:
  selector:
    app: bot
  ports:
  - port: 8080
    targetPort: 8080
