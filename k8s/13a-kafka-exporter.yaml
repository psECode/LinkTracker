---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: link-tracker
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: kafka-exporter
        image: danielqsj/kafka-exporter:v1.9.0
        imagePullPolicy: IfNotPresent
        args:
        - --kafka.server=kafka-0.kafka.link-tracker.svc:9092
        ports:
        - containerPort: 9308
          name: metrics
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
